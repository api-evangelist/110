limits: []
throughput_control:
  mechanism: message rate (app general settings)
  controlled_by: sender (the device operator)
  backpressure: none
  description: >-
    The publication frequency is a setting on the phone. The NDI feature's
    framerate "follows the message rate in general settings"
    (https://1-10.github.io/ZIGSIM_docs/features/ndi.html). A receiver that
    cannot keep up has no signalling channel — over UDP it simply loses
    datagrams, and nothing tells the sender or the developer that it happened.
  docs: https://1-10.github.io/ZIGSIM_docs/features/ndi.html
