source: >-
  https://1-10.github.io/ZIGSIM_docs/ (Getting Started, Tutorial, and the NDI and
  general-settings notes on the feature pages), probed 2026-09-05. No other 1→10
  surface documents limits of any kind.
description: >-
  1→10 publishes no rate limits, because it publishes no hosted API to limit.
  ZIG SIM's throughput is set by the SENDER — the message rate chosen in the
  app's general settings — and the receiver has no way to push back. There are no
  HTTP rate-limit headers, no 429, and no Retry-After, because there is no HTTP
  request/response cycle at all.
limit_count: 0
