aid: '110'
name: 1→10, Inc.
description: >-
  1→10, Inc. (株式会社ワントゥーテン, "One to Ten") is a Kyoto-headquartered creative
  technology company that designs and builds spatial experiences — projection
  mapping and large-scale interactive land art, XR installations, AI concierge and
  robotics work, IoT product prototyping and brand content — for commercial
  facilities, cultural sites and events. Founded October 1997, with offices in
  Kyoto and Tokyo and a Singapore holding company, it positions itself as a
  "Spatial DX" studio and is known for permanent installations such as Magical
  Shores at Siloso Beach in Singapore and the Nijo Castle YAKAI night event in
  Kyoto. It is a project-based studio rather than an API platform: its one
  developer-facing product is ZIG SIM, a smartphone sensor-streaming app used for
  physical prototyping, and it publishes an Agent Skill for public use.
